map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

# HSTS nur, wenn der vorgeschaltete Proxy HTTPS meldet (leerer Wert = Header entfällt)
map $http_x_forwarded_proto $sdwan_hsts {
  https   "max-age=31536000";
  default "";
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  client_max_body_size 20m;

  # Sicherheits-Header (AUDIT-010). Hinweis: add_header in einer location ersetzt diese Werte dort – deshalb wiederholt
  # "location /" sie zusammen mit der CSP (nur für die Oberfläche, nicht für Grafana).
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
  add_header Strict-Transport-Security $sdwan_hsts always;

  # Hub-Agent spricht die API direkt im Docker-Netz an – nie über den öffentlichen Proxy
  location /api/v1/internal/ {
    return 404;
  }

  location /api/ {
    proxy_pass http://api:8000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
  }

  location /healthz { proxy_pass http://api:8000; }

  location /grafana/ {
    proxy_pass http://grafana:3000;
    proxy_set_header Host $host;
  }

  location / {
    try_files $uri /index.html;
    # CSP: Skripte nur von hier plus das Theme-Skript in index.html (Hash; bei Änderung neu berechnen – Test
    # tests/audit/test_audit_fixes_ap3.py prüft das). Inline-Styles für React-style-Attribute, data:/blob: für QR-Codes,
    # Logos und Downloads. frame-ancestors verhindert Einbettung auf fremden Seiten (Clickjacking).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-Sj9mHXDIGGkjZXIugSWm0s5ohTrqgEsO+qdk54NnW7Q='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-src 'self' blob: data:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Strict-Transport-Security $sdwan_hsts always;
  }
}
