<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.svg" />
    <title></title><!-- Produktname kommt zur Laufzeit aus /api/v1/meta -->
    <script>
      // Theme vor dem ersten Rendern setzen (kein Aufblitzen). Gleiche Logik wie src/lib/theme.ts.
      (function () {
        var pref = "system";
        try { pref = localStorage.getItem("fm.theme") || "system"; } catch (e) {}
        var dark = pref === "dark" || (pref === "system" && window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
